; PlatformIO Project Configuration — M5StickC Plus 2
; SmartAdapter IDP Demo Firmware

[env:m5stick-c-plus2]
platform  = espressif32
board     = m5stick-c
framework = arduino

; M5Unified avoids the broken third-party dependencies of the older library
lib_deps =
    m5stack/M5Unified @ ^0.1.14
    bblanchon/ArduinoJson @ ^7.0.0

; Serial monitor baud rate
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
