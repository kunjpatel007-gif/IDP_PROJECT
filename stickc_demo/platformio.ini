; PlatformIO Project Configuration — M5StickC Plus 2
; SmartAdapter IDP Demo Firmware

[env:m5stick-c-plus2]
platform  = espressif32
board     = m5stick-c
framework = arduino

; M5StickCPlus2 library + ArduinoJson for structured POST
lib_deps =
    m5stack/M5StickCPlus2 @ ^1.0.0
    bblanchon/ArduinoJson   @ ^7.0.0

; Serial monitor baud rate
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
